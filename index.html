<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VIROID</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HERO SECTION
    ========================== -->

    <main class="hero">

        <h1 class="agency-name">VIROID</h1>

        <p class="eyebrow">MEDIA AGENCY</p>

        <video class="hero-video" autoplay muted loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>


        <!-- TOP NAVIGATION -->

        <nav class="top-nav">
            <a href="#" id="editor-link">Editor</a>
            <a href="#">Cinematographer</a>
        </nav>


        <!-- DEPARTMENTS -->

        <div class="departments">

            <div class="department">
                <h2>SOCIAL</h2>
                <h4>Instagram Content</h4>
                <a href="#">Rahul Patil</a>
            </div>

            <div class="department">
                <h2>FILM</h2>
                <h4>Short Film Production</h4>
                <a href="#">Viraj Sawant</a>
            </div>

            <div class="department">
                <h2>VIDEO</h2>
                <h4>YouTube Content</h4>
                <a href="#">Aditya Sharma</a>
            </div>

        </div>

    </main>


    <!-- =========================
         WORK SECTION
    ========================== -->

    <section class="work">

        <div class="work-header">
            <p>SELECTED WORK</p>
            <h2>RECENT PROJECTS</h2>
        </div>


        <!-- PROJECT 01 -->

        <div class="project">

            <div class="project-media">

                <video autoplay muted loop playsinline>
                    <source src="project1.mp4" type="video/mp4">
                </video>

                <span class="view-project">
                    VIEW PROJECT ↗
                </span>

            </div>


            <div class="project-info">

                <h3>PROJECT ONE</h3>

                <p>Social Campaign</p>

            </div>

        </div>

    </section>
    <script src="script.js"></script>

</body>

</html>
